<html>
    <head>
        <link rel="stylesheet" href=""></link>
        <style>
            * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
        }

body {
    font-family: 'Segoe UI', sans-serif;
    background-color: #f9f9f9;
    padding: 20px;
}
.container{
    max-width: 500px;
    margin: auto;
    text-align: center;
    background-color: #ffffff;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 4px 12px rgba(32, 30, 30, 0.1);
}
.container img{
    width:100px;
    height: 100px;
    border-radius: 50px;
    margin-bottom: 15px;
}
.container h1{
    text-align: center;
    padding: 10px;
}
.bio{
    font-size: 16px;
    color: #555;
    margin: 10px 0 20px;
}
.hobby{
    list-style-type: disc;
    text-align: left;
    padding-left: 20px;
    color: #555;
}
@media (max-width: 480px) {
    .container {
        padding: 15px;
    }

    h1 {
        font-size: 20px;
    }

    .bio, .hobby {
        font-size: 14px;
    }
}
        </style>
    </head>
    <body>
        <div class="container">
            <img src="../assignment/passport pic.png">
            <h1>OVIYA A</h1>
        <div class="bio">
            <p>I’m Oviya, a Computer Science Engineering graduate passionate about front-end development and creating smooth, user-friendly web experiences. 
                I enjoy bringing ideas to life through clean code and creative design.
           </p>
        </div>
            <h3>Hobbies:</h3>
        <ul class="hobby">
            <li>Gardening</li>
            <li>Reading Books</li>
            <li>Tailoring</li>
        </ul>
    </div>
    </body>
</html>
